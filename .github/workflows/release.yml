name: Release

# One version, built twice — a debug APK to try and a signed release APK to
# install.
#
#   Run workflow (minor)   bumps 0.1.7 -> 0.2.0, commits, tags v0.2.0, builds
#   git push v0.2.0        builds the tag exactly as it stands, no bump
on:
  workflow_dispatch:
    inputs:
      level:
        description: 'How far to move the version'
        type: choice
        options: [minor, patch, major]
        default: minor
      version:
        description: 'Or an exact version, e.g. 0.3.0 (overrides the level)'
        required: false
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Two builds instead of one; still far below GitHub's six-hour default.
    timeout-minutes: 45
    permissions:
      contents: write        # the release, the tag, and the version bump

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || 'main' }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.10'
          channel: stable
          cache: true

      # One number for the whole job, so the debug APK and the signed APK can
      # never be different versions.
      - name: Version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${GITHUB_REF_NAME#v}"
            IN_PUBSPEC="$(grep -E '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/\+.*//')"
            if [ "$V" != "$IN_PUBSPEC" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match pubspec ($IN_PUBSPEC). Cut the tag from a commit where they agree."
              exit 1
            fi
          else
            if [ -n "${{ github.event.inputs.version }}" ]; then
              V="$(tool/bump_version.sh set '${{ github.event.inputs.version }}')"
            else
              V="$(tool/bump_version.sh '${{ github.event.inputs.level }}')"
            fi
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml lib/platform/versioning/version.dart
            git commit -m "v$V [skip ci]"
            git pull --rebase --autostash
            git push
            # Pushed with GITHUB_TOKEN, which does not trigger another run.
            git tag "v$V"
            git push origin "v$V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Before anything is signed or published: a red test must not become a
      # release someone installs.
      - name: Test
        run: flutter test

      - name: Restore debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set — the debug APK in this release is signed with a throwaway key."
            exit 0
          fi
          echo "$DEBUG_KEYSTORE_B64" | base64 --decode > android/debug.keystore

      - name: Build debug
        run: |
          flutter build apk --debug --split-per-abi
          mkdir -p dist/debug
          V="${{ steps.version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "dist/debug/habit-force-debug-$V-arm64.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-debug.apk "dist/debug/habit-force-debug-$V-x86_64.apk"

      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew --no-daemon -q :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: habit-force-debug-${{ steps.version.outputs.version }}
          path: dist/debug/*.apk
          retention-days: 14
          compression-level: 0

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set — the build would fall back to the debug key and produce an APK that cannot update anyone's install."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release
        run: flutter build apk --release --split-per-abi

      # Proves the artefact is signed by the real key rather than the debug
      # fallback, which is silent and otherwise only noticed by users.
      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -E "certificate DN|SHA-1 digest"
          if "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             | grep -qi "CN=Android Debug"; then
            echo "::error::Signed with the DEBUG key — check the keystore secrets."
            exit 1
          fi

      # Android 16 phones are 64-bit: one arm64 APK is the whole release.
      - name: Name the artefact
        run: |
          V="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/habit-force-v$V-arm64.apk"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="v${{ steps.version.outputs.version }}"
          gh release view "$V" >/dev/null 2>&1 \
            && gh release upload "$V" dist/*.apk --clobber \
            || gh release create "$V" dist/*.apk --title "$V" --generate-notes

      # Releases stay; only the binaries of all but the newest ten go.
      # publishedAt, not createdAt: createdAt is the date of the commit the tag
      # points at, so tagging an old commit would prune the new release at once.
      - name: Keep the APKs of the last ten releases only
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: 10
        run: |
          stale=$(gh release list --limit 200 --json tagName,publishedAt \
                    --jq "sort_by(.publishedAt) | reverse | .[$KEEP:] | .[].tagName")
          [ -z "$stale" ] && { echo "Nothing to prune."; exit 0; }
          for tag in $stale; do
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$tag" "$asset" --yes || echo "::warning::could not remove $tag/$asset"
            done
          done

      - name: Shred the keys
        if: always()
        run: rm -f android/upload-keystore.jks android/key.properties android/debug.keystore
